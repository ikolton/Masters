  positive_pathology_weight: 1.0
  negative_pathology_weight: 0.5
  semantic_weight: 0.0
  semantic_variant: family
train:
  run_id: smoke_eos_concept_lexical_v1_5_w002
  epochs: 1
  max_steps: 8
  batch_size: 2
  num_workers: 0
  learning_rate: 0.00001
  grad_accum_steps: 1
  log_every: 1
