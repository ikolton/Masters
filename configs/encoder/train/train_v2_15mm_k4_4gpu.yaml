paths:
  dataset_root_env: ORGAN_SEG_CLIP_DATASET_ROOT
  dataset_root: ''
  output_dir: ../../../outputs/encoder/v2_15mm_k4_4gpu
data:
  train_split: train
  val_split: val
  train_limit: null
  val_limit: null
  lesion_metadata_csv: ''
preprocessing:
  resample_spacing:
  - 1.5
  - 1.5
  - 1.5
  foreground_crop: true
  canonical_size: null
text_encoder:
  backend_family: pubmedbert
  model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  freeze_encoder: true
  unfreeze_last_n_layers: 0
  max_tokens: 48
  report_max_tokens: 512
  pooling: cls
  projection_dim: 256
  cache_frozen_outputs: true
  disk_cache_path: /net/scratch/hscra/plgrid/plgikolton/text_embedding_cache/pubmedbert_base_uncased_abstract_fulltext.pt
model:
  organ_query_count: 11
  segmamba:
    in_channels: 1
    depths:
    - 2
    - 2
    - 2
    - 2
    feat_size:
    - 48
    - 96
    - 192
    - 384
    activation_checkpointing: true
    pretrained_checkpoint_path: ''
    segmentation_class_count: 23
    segmentation_full_resolution: false
  patching:
    patch_size:
    - 160
    - 160
    - 64
    patch_stride:
    - 160
    - 160
    - 64
    patch_batch_size: 16
    segmentation_supervision_max_patches_per_study: 1
  tokenizer:
    model_dim: 256
    summary_grid:
    - 3
    - 3
    - 2
  aggregator:
    num_latents: 32
    num_layers: 2
    num_heads: 8
    dropout: 0.1
  grid_combiner:
    enabled: true
    depth: 2
    num_heads: 8
    dropout: 0.1
    position_features: grid_box
  organs:
    diagnostic_dropout: 0.1
    organ_logit_scale_max: 20.0
loss:
  alignment_type: siglip
  organ_alignment_weight: 1.0
  organ_pair_balance: true
  organ_positive_weight: 1.0
  organ_same_organ_weight: 1.0
  organ_cross_organ_weight: 0.0
  organ_frequency_balance: false
  organ_frequency_balance_power: 0.5
  organ_frequency_balance_min: 0.25
  organ_frequency_balance_max: 4.0
  report_alignment_weight: 0.0
  segmentation_weight: 0.25
  diagnostic_weight: 0.25
  patch_organ_presence_weight: 0.1
  organ_attention_weight: 0.1
  lesion_global_weight: 0.0
  lesion_organ_weight: 0.05
  segmentation_loss_type: dice_ce
training:
  seed: 13
  device: cuda
  batch_size: 6
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  epochs: 20
  learning_rate: 0.0001
  alignment_parameter_learning_rate: 1.0e-05
  weight_decay: 0.0001
  scheduler_type: cosine
  warmup_steps: 500
  min_learning_rate: 1.0e-06
  scheduler_interval: step
  amp: true
  amp_dtype: bfloat16
  max_grad_norm: 1.0
  log_every_steps: 25
  save_every_steps: 1000
  validation_every_epochs: 2
  fast_val_limit: 512
  fast_val_sampling: fixed
  fast_val_skip_segmentation: true
  profile_timing: false
  save_last_checkpoint: true
  save_best_checkpoint: true
  ddp_find_unused_parameters: true
  best_checkpoint_metric: full_val_organ_alignment_loss
  freeze_text_projection_after_epoch: 5
  grad_cache_accum_steps: 4
  patch_encoder_learning_rate_scale: 0.1
runtime:
  compile_model: false
logging:
  experiment_name: organ_seg_clip
  wandb_enabled: true
  wandb_project: organ_seg_clip
  wandb_run_name: v2_15mm_k4_4gpu
  wandb_mode: online
  wandb_tags:
  - encoder
  - v2
  - 1.5mm
  - 160x160x64
  - gradcache_k4
  - act_ckpt
  - seg025
  - logit_max20
  - freeze_proj_ep5
  - 4gpu
  - bs6
  wandb_step_log_start: 0
