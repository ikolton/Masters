paths:
  dataset_root: ''
  output_dir: ../../../outputs/decoder/profile_decoder_2gpu_bs8
  visual_encoder_checkpoint: /net/scratch/hscra/plgrid/plgikolton/Magisterka/Masters/outputs/encoder/organsegclip_128x48_20ep_uniformtext_schedcos_logitslr1e5_gh200_2gpu_bs12/visual_encoder_best.pt
  feature_cache_dir: ../../../outputs/decoder/profile_decoder_cache_best6/features
data:
  train_split: train
  val_split: val
  train_limit: 1024
  val_limit: 256
  verify_metadata: true
  lesion_metadata_csv: ''
  lesion_positive_repeat_factor: 4
  abnormal_label_repeat_factor: 2
  organ_names:
  - Spleen
  - Kidneys
  - Gallbladder
  - Liver
  - Stomach
  - Pancreas
  - Adrenal glands
  - Small bowel
  - Colon
  - Urinary bladder
  - Prostate
model:
  llm_model_name_or_path: Qwen/Qwen2.5-0.5B
  visual_prefix_mode: report_plus_organ
  prompt_template: 'Generate the CT finding for {organ}###

    '
  max_length: 256
  max_new_tokens: 128
  freeze_llm: true
  gradient_checkpointing: true
  torch_dtype: auto
lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
diagnostic_loss:
  enabled: true
  weight: 1.0
  positive_pathology_weight: 1.5
  negative_pathology_weight: 0.25
  small_bowel_duodenum_negative_weight: 0.1
  positive_normal_penalty_weight: 1.0
  epsilon: 1.0e-06
  pathology_words:
  - lesion
  - lesions
  - cyst
  - cysts
  - mass
  - masses
  - nodule
  - nodules
  - metastasis
  - metastases
  - tumor
  - tumour
  normal_words:
  - unremarkable
  - normal
  - within normal limits
  - no abnormality
  - no focal abnormality
training:
  seed: 13
  device: cuda
  batch_size: 8
  epochs: 1
  learning_rate: 0.0002
  projector_learning_rate: 0.0002
  weight_decay: 0.0
  amp: true
  max_grad_norm: 1.0
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  log_every_steps: 20
  save_every_steps: 0
  save_last_checkpoint: true
  save_best_checkpoint: true
  best_checkpoint_metric: val_total_loss
  ddp_find_unused_parameters: false
  precompute_features_if_missing: false
generation:
  do_sample: false
  num_beams: 1
  repetition_penalty: 1.2
  max_new_tokens: 128
logging:
  experiment_name: profile_decoder_2gpu_bs8
