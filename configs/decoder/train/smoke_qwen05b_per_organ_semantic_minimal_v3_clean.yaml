paths:
  dataset_root: ''
  output_dir: ../../../outputs/decoder/smoke_qwen05b_per_organ_semantic_minimal_v3_clean
  visual_encoder_checkpoint: ../../../outputs/encoder/organsegclip_128x48_20ep_uniformtext_schedcos_logitslr1e5_gh200_2gpu_bs12/visual_encoder_best.pt
  feature_cache_dir: ../../../outputs/decoder/smoke_qwen05b_per_organ_semantic_minimal_v3_clean/features

data:
  train_split: train
  val_split: val
  train_limit: 8
  val_limit: 4
  verify_metadata: true
  lesion_metadata_csv: ''
  organ_names:
    - Spleen
    - Kidneys
    - Gallbladder
    - Liver
    - Stomach
    - Pancreas
    - Adrenal glands
    - Small bowel
    - Colon
    - Urinary bladder
    - Prostate

model:
  llm_model_name_or_path: Qwen/Qwen2.5-0.5B
  visual_prefix_mode: report_plus_organ
  prompt_template: "Generate the CT finding for {organ}###\n"
  max_length: 256
  max_new_tokens: 128
  freeze_llm: true
  gradient_checkpointing: true
  torch_dtype: auto

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

diagnostic_loss:
  enabled: false
  weight: 0.5
  positive_pathology_weight: 1.0
  negative_pathology_weight: 0.5
  small_bowel_duodenum_negative_weight: 0.25
  positive_normal_penalty_weight: 0.25
  epsilon: 1.0e-6
  pathology_words:
    - lesion
    - lesions
    - cyst
    - cysts
    - mass
    - masses
    - nodule
    - nodules
    - metastasis
    - metastases
    - tumor
    - tumour
  normal_words:
    - unremarkable
    - normal
    - within normal limits
    - no abnormality
    - no focal abnormality

semantic_loss:
  enabled: true
  variant: minimal
  weight: 0.25
  normality_weight: 1.0
  polarity_weight: 1.0
  family_weight: 1.0
  subtype_weight: 0.0
  primary_weight: 1.0
  secondary_weight: 1.0
  accepted_sample_weight: 1.0
  provisional_sample_weight: 0.5
  unresolved_sample_weight: 0.0
  use_confidence_scaling: true
  training_targets_jsonl: ../../../outputs/semantic_tagging/merlin_converted/consolidation/consolidation_v3/postprocess_v3_clean/semantic_training_targets_v3.jsonl
  training_vocab_json: ../../../outputs/semantic_tagging/merlin_converted/consolidation/consolidation_v3/postprocess_v3_clean/training_vocab_v3_clean.json
  include_review_required: false
  review_required_sample_weight: 0.25

training:
  seed: 13
  device: cuda
  batch_size: 1
  epochs: 1
  learning_rate: 2.0e-4
  projector_learning_rate: 2.0e-4
  weight_decay: 0.0
  amp: true
  max_grad_norm: 1.0
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  log_every_steps: 1
  save_every_steps: 0
  save_last_checkpoint: true
  save_best_checkpoint: true
  best_checkpoint_metric: val_total_loss
  ddp_find_unused_parameters: false
  precompute_features_if_missing: true

generation:
  do_sample: false
  num_beams: 1
  repetition_penalty: 1.2
  max_new_tokens: 128

logging:
  experiment_name: smoke_qwen05b_per_organ_semantic_minimal_v3_clean
