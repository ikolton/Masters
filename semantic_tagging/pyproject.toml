[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-tagging"
version = "0.1.0"
description = "Standalone semantic tagging subproject for organ text supervision"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SemanticTagging"}]
dependencies = [
  "PyYAML",
  "jsonschema",
  "requests",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
inference = ["transformers", "torch"]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
