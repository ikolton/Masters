project:
  dataset_id: merlin_converted
  consolidation_id: consolidation_v3

paths:
  output_root: /net/scratch/hscra/plgrid/plgikolton/Magisterka/Masters/outputs/semantic_tagging

source_runs:
  base:
    run_id: vllm_full
    decision_file: validated_decisions.partial.jsonl
  organ_overrides:
    Colon:
      run_id: vllm_targeted_v3_candidate
      decision_file: validated_decisions.partial.jsonl
    Gallbladder:
      run_id: vllm_targeted_v4_candidate
      decision_file: validated_decisions.partial.jsonl
    Kidneys:
      run_id: vllm_targeted_v3_candidate
      decision_file: validated_decisions.partial.jsonl
    Small bowel:
      run_id: vllm_targeted_v3_candidate
      decision_file: validated_decisions.partial.jsonl

consolidation:
  min_direct_count: 100
  min_review_count: 20
  examples_per_tag: 8
  candidate_label_limit: 40
  include_normal_tags: true
  controlled_families:
    - normal
    - absent_postop
    - focal_lesion
    - mass_or_malignancy
    - inflammation
    - wall_thickening
    - ductal_or_luminal_dilatation
    - obstruction
    - stone_or_calcification
    - cystic_or_fluid_lesion
    - fluid_or_collection
    - vascular
    - gas_or_air
    - postoperative_or_device
    - anatomic_variant
    - size_or_morphology
    - limited_assessment
    - ambiguous_or_indeterminate
    - trauma_or_injury
    - other_abnormal
  llm:
    model_name: meta-llama/Llama-3.3-70B-Instruct
    base_url: http://127.0.0.1:8000/v1
    api_key_env: VLLM_API_KEY
    temperature: 0.0
    top_p: 1.0
    max_tokens: 640
    request_concurrency: 24
    request_retries: 4
    retry_backoff_seconds: 2.0
